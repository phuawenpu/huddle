version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: critique-hud
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/app.db
      - ASSET_DIR=./data/audio
    volumes:
      - app-data:/app/data

volumes:
  app-data:
