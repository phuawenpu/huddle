# fly.toml app configuration file generated for huddler on 2026-08-13T07:13:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'huddler'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASSET_DIR = '/data/audio'
  DATABASE_URL = 'file:/data/app.db'
  IDLE_TERMINATE_SECONDS = '120'
  NODE_ENV = 'production'
  PORT = '3000'
  ROOM_IR_DIR = '/data/ir'
  SIMULATION_ENABLED = 'true'
  TOPIC_SUGGESTION_TTL_SECONDS = '3600'

[[mounts]]
  source = 'critique_hud_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'get'
    path = '/api/time'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
